<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="startScreen">
    <div class="main-menu-container">
        <header class="menu-header">
            <div class="high-score-tag">RECORD: <span id="bestScoreDisplay">0000</span></div>
            <h1 class="glitch-title" data-text="NEON ARENA">NEON ARENA</h1>
            <p class="subtitle">SYSTEM INITIALIZATION REQUIRED</p>
        </header>

        <div class="menu-section">
            <label>OPERATOR IDENTITY</label>
            <input type="text" id="username" placeholder="ENTER ID..." maxlength="12" autocomplete="off">
        </div>

        <div class="menu-grid">
            <div class="config-box">
                <label>THREAT LEVEL</label>
                <div class="btn-group">
                    <button class="diff-btn" data-diff="easy">EASY</button>
                    <button class="diff-btn active" data-diff="normal">NORM</button>
                    <button class="diff-btn" data-diff="hard">HARD</button>
                </div>
            </div>

            <div class="config-box">
                <label>HULL TINT</label>
                <div class="color-picker">
                    <div class="swatch active" data-color="#00f3ff" style="--c: #00f3ff"></div>
                    <div class="swatch" data-color="#ff00ea" style="--c: #ff00ea"></div>
                    <div class="swatch" data-color="#39ff14" style="--c: #39ff14"></div>
                    <div class="swatch" data-color="#ffd700" style="--c: #ffd700"></div>
                </div>
            </div>
        </div>

        <footer class="menu-footer">
            <button id="startBtn" class="primary-btn" disabled>ENGAGE SYSTEM</button>
            <div class="controls-hint">
                [WASD] MOVE • [F] NUKE • [MOUSE/JOYSTICK] FIRE
            </div>
        </footer>
    </div>
</div>

<div id="joystick-container">
    <div id="left-joystick" class="joystick-base"><div class="joystick-nub"></div></div>
    <div id="right-joystick" class="joystick-base"><div class="joystick-nub"></div></div>
</div>

<div id="ui">
    <div style="display: flex; justify-content: space-between; width: 100%; margin-bottom: 5px;">
        <div>OPERATOR: <span id="operatorDisplay" class="neon-text-blue"></span></div>
        <div style="margin-right: 40px;">SCORE: <span id="scoreDisplay" class="neon-text-blue">0</span></div>
    </div>
    <div>ARMOR: <span id="healthDisplay" class="neon-text-red">5</span></div>
    <div>AMMO: <span id="ammoDisplay" class="neon-text-blue">READY [3]</span></div>
    <div>SYSTEM: <span id="modeDisplay" class="neon-text-blue">ATTACK (1)</span></div>
</div>

<canvas id="gameCanvas"></canvas>
<script src="game.js"></script>
</body>
</html>
