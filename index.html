<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="startScreen">
       <div class="glass-panel">
            <div class="high-score-box">BEST RUN: <span id="bestScoreDisplay">0</span></div>
            
            <h1 class="glitch" data-text="NEON ARENA">NEON ARENA</h1>
            
            <input type="text" id="username" placeholder="ENTER OPERATOR ID" autocomplete="off">
            
            <div class="panel-section">
                <p class="section-title">THREAT LEVEL</p>
                <div class="btn-group">
                    <button class="diff-btn" data-diff="easy">EASY</button>
                    <button class="diff-btn active" data-diff="normal">NORMAL</button>
                    <button class="diff-btn" data-diff="hard">HARD</button>
                </div>
            </div>

            <div class="panel-section">
                <p class="section-title">HULL COLOR</p>
                <div class="color-group">
                    <div class="color-swatch active" data-color="#00f3ff" style="background: #00f3ff; box-shadow: 0 0 10px #00f3ff;"></div>
                    <div class="color-swatch" data-color="#ff00ea" style="background: #ff00ea; box-shadow: 0 0 10px #ff00ea;"></div>
                    <div class="color-swatch" data-color="#39ff14" style="background: #39ff14; box-shadow: 0 0 10px #39ff14;"></div>
                    <div class="color-swatch" data-color="#ffcc00" style="background: #ffcc00; box-shadow: 0 0 10px #ffcc00;"></div>
                </div>
            </div>

            <div class="controls-readout">
                <p>► [W][A][S][D] - THRUSTERS</p>
                <p>► [MOUSE] - AIM & FIRE</p>
                <p>► [SPACE] - PHASE DASH</p>
                <p>► [1] & [2] - WEAPON MODES</p>
            </div>

            <button id="startBtn" disabled>INITIALIZE SYSTEM</button> 
        </div>
    </div>

   <div id="ui">
        <div style="display: flex; justify-content: space-between; width: 100%; margin-bottom: 5px;">
            <div>OPERATOR: <span id="operatorDisplay" class="neon-text-blue"></span></div>
            <div style="margin-right: 40px;">SCORE: <span id="scoreDisplay" class="neon-text-blue">0</span></div>
        </div>
        <div>ARMOR: <span id="healthDisplay">5</span></div>
        <div id="ammoDisplay" class="neon-text-blue">READY [3]</div>
        <div id="modeDisplay" class="neon-text-blue">ATTACK (1)</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script src="game.js"></script>
</body>
</html>
